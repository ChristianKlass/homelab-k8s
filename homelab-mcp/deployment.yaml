apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: homelab-mcp
  name: homelab-mcp
  namespace: homelab-mcp
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: homelab-mcp
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/restartedAt: '2026-08-10T23:05:00+08:00'
      labels:
        app: homelab-mcp
    spec:
      imagePullSecrets:
      - name: gitlab-registry
      containers:
      - env:
        - name: TZ
          value: Asia/Singapore
        - name: PORT
          value: '8080'
        - name: HA_URL
          value: http://10.0.0.2:8123
        - name: HA_TOKEN
          valueFrom:
            secretKeyRef:
              key: HA_TOKEN
              name: homelab-mcp-secret
        - name: PROXMOX_HOSTS
          valueFrom:
            secretKeyRef:
              key: PROXMOX_HOSTS
              name: homelab-mcp-secret
        - name: PROXMOX_TOKEN_ID
          valueFrom:
            secretKeyRef:
              key: PROXMOX_TOKEN_ID
              name: homelab-mcp-secret
        - name: PROXMOX_TOKEN_SECRET
          valueFrom:
            secretKeyRef:
              key: PROXMOX_TOKEN_SECRET
              name: homelab-mcp-secret
        image: 10.0.0.17:5050/homelab/k8s/homelab-mcp:latest
        imagePullPolicy: Always
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /health
            port: 8080
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 1
        name: homelab-mcp
        ports:
        - containerPort: 8080
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /health
            port: 8080
            scheme: HTTP
          initialDelaySeconds: 5
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 1
        resources:
          limits:
            cpu: 500m
            memory: 256Mi
          requests:
            cpu: 100m
            memory: 128Mi
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      terminationGracePeriodSeconds: 30
