apiVersion: v1
kind: Service
metadata:
  annotations:
    metallb.io/ip-allocated-from-pool: first-pool
  name: homelab-mcp
  namespace: homelab-mcp
spec:
  allocateLoadBalancerNodePorts: true
  externalTrafficPolicy: Cluster
  internalTrafficPolicy: Cluster
  ipFamilies:
  - IPv4
  ipFamilyPolicy: SingleStack
  loadBalancerIP: 10.0.0.113
  ports:
  - nodePort: 31328
    port: 8080
    protocol: TCP
    targetPort: 8080
  selector:
    app: homelab-mcp
  sessionAffinity: None
  type: LoadBalancer
