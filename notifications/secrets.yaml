# PLACEHOLDER: Secrets for notifications stack
# These secrets contain sensitive credentials and must be created manually.
# DO NOT commit actual secret values to the repository.
#
# Required secrets:
# 1. n8n-credentials - n8n encryption key
#    - N8N_ENCRYPTION_KEY
#
# 2. n8n-postgres-secret - n8n database credentials (managed by CloudNativePG bootstrap)
#    - POSTGRES_DB
#    - POSTGRES_USER
#    - POSTGRES_PASSWORD
#
# 3. n8n-discord-credentials - Discord bot integration
#    - DISCORD_BOT_TOKEN
#    - DISCORD_CHANNEL_DEFAULT
#    - DISCORD_CHANNEL_CRITICAL
#    - DISCORD_CHANNEL_INFO
#    - DISCORD_CHANNEL_MEDIA
#    - DISCORD_CHANNEL_ALERTS
#    - DISCORD_CHANNEL_NOTIFICATIONS
#
# To create these secrets:
# kubectl create secret generic n8n-credentials -n notifications --from-literal=N8N_ENCRYPTION_KEY=<key>
# kubectl create secret generic n8n-discord-credentials -n notifications \
#   --from-literal=DISCORD_BOT_TOKEN=<token> \
#   --from-literal=DISCORD_CHANNEL_DEFAULT=<id> \
#   --from-literal=DISCORD_CHANNEL_CRITICAL=<id> \
#   --from-literal=DISCORD_CHANNEL_INFO=<id> \
#   --from-literal=DISCORD_CHANNEL_MEDIA=<id> \
#   --from-literal=DISCORD_CHANNEL_ALERTS=<id> \
#   --from-literal=DISCORD_CHANNEL_NOTIFICATIONS=<id>
#
# n8n-postgres-secret is bootstrapped automatically by the CloudNativePG cluster definition.
