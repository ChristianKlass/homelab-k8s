apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gitlab-agent
  namespace: gitlab-agent
spec:
  interval: 30m
  # Adopt the existing in-cluster release of the same name/namespace.
  releaseName: gitlab-agent
  chart:
    spec:
      chart: gitlab-agent
      version: "2.26.0"
      sourceRef:
        kind: HelmRepository
        name: gitlab
        namespace: gitlab-agent
      interval: 1h
  values:
    config:
      kasAddress: wss://git.markklass.dev/-/kubernetes-agent/
      # Plain Secret, managed out-of-band (NOT in git, excluded from Flux prune).
      secretName: gitlab-agent-token
