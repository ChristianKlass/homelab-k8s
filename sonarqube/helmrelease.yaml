apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sonarqube
  namespace: sonarqube
spec:
  interval: 30m
  releaseName: sonarqube
  chart:
    spec:
      chart: sonarqube
      version: "2026.2.1"
      sourceRef:
        kind: HelmRepository
        name: sonarqube
        namespace: sonarqube
      interval: 1h
  # Sensitive values are injected from the `sonarqube-secrets` Secret (managed
  # out-of-band, NOT in git). Until that Secret exists with the matching keys,
  # adoption is NOT a no-op — see README.
  valuesFrom:
    - kind: Secret
      name: sonarqube-secrets
      valuesKey: jdbcPassword
      targetPath: jdbcOverwrite.jdbcPassword
    - kind: Secret
      name: sonarqube-secrets
      valuesKey: monitoringPasscode
      targetPath: monitoringPasscode
  values:
    community:
      enabled: true
    postgresql:
      enabled: false
    jdbcOverwrite:
      enable: true
      jdbcUrl: jdbc:postgresql://postgres-ha-rw.databases.svc.cluster.local:5432/sonarqube
      jdbcUsername: sonarqube
    persistence:
      enabled: true
      size: 10Gi
      storageClass: longhorn
    nodeSelector:
      kubernetes.io/hostname: k8s-worker-01
    startupProbe:
      failureThreshold: 60
      initialDelaySeconds: 30
      periodSeconds: 20
      timeoutSeconds: 10
    livenessProbe:
      failureThreshold: 6
      initialDelaySeconds: 300
      periodSeconds: 30
      timeoutSeconds: 10
