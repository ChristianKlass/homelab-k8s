apiVersion: apps/v1
kind: DaemonSet
metadata:
  annotations:
    deprecated.daemonset.template.generation: '5'
  labels:
    app: promtail
  name: promtail
  namespace: monitoring
spec:
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: promtail
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/restartedAt: '2026-04-04T00:18:55+08:00'
      labels:
        app: promtail
    spec:
      containers:
      - args:
        - -config.file=/etc/promtail/promtail.yaml
        - -config.expand-env=true
        env:
        - name: HOSTNAME
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: spec.nodeName
        image: grafana/promtail:3.0.0
        imagePullPolicy: IfNotPresent
        name: promtail
        ports:
        - containerPort: 9080
          name: http
          protocol: TCP
        resources:
          limits:
            cpu: 200m
            memory: 128Mi
          requests:
            cpu: 50m
            memory: 64Mi
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /etc/promtail
          name: config
        - mountPath: /run/promtail
          name: run
        - mountPath: /var/log/pods
          name: pods
          readOnly: true
        - mountPath: /var/lib/docker/containers
          name: containers
          readOnly: true
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      serviceAccount: promtail
      serviceAccountName: promtail
      terminationGracePeriodSeconds: 30
      tolerations:
      - effect: NoSchedule
        operator: Exists
      volumes:
      - configMap:
          defaultMode: 420
          name: promtail-config
        name: config
      - hostPath:
          path: /run/promtail
          type: ''
        name: run
      - hostPath:
          path: /var/log/pods
          type: ''
        name: pods
      - hostPath:
          path: /var/lib/docker/containers
          type: ''
        name: containers
  updateStrategy:
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
    type: RollingUpdate
