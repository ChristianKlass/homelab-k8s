# PLACEHOLDER: Secrets for monitoring stack
# These secrets contain sensitive credentials and must be created manually.
# DO NOT commit actual secret values to the repository.
#
# Required secrets:
# 1. grafana-admin - Grafana admin credentials
#    - GF_SECURITY_ADMIN_USER
#    - GF_SECURITY_ADMIN_PASSWORD
#
# 2. telegram-bot-credentials - Telegram bot token for Alertmanager
#    - TELEGRAM_BOT_TOKEN
#    - TELEGRAM_CHAT_ID
#
# 3. proxmox-api - Proxmox API credentials for discovery
#    - PROXMOX_USER
#    - PROXMOX_PASSWORD
#    - PROXMOX_REALM
#
# 4. homeassistant-token - Home Assistant API token
#    - token
#
# To create these secrets:
# kubectl create secret generic grafana-admin -n monitoring --from-literal=GF_SECURITY_ADMIN_USER=admin --from-literal=GF_SECURITY_ADMIN_PASSWORD=<password>
# kubectl create secret generic telegram-bot-credentials -n monitoring --from-literal=TELEGRAM_BOT_TOKEN=<token> --from-literal=TELEGRAM_CHAT_ID=<id>
# kubectl create secret generic proxmox-api -n monitoring --from-literal=PROXMOX_USER=<user> --from-literal=PROXMOX_PASSWORD=<password> --from-literal=PROXMOX_REALM=<realm>
# kubectl create secret generic homeassistant-token -n monitoring --from-literal=token=<token>
